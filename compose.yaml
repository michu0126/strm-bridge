services:
  strm-bridge:
    image: michu0126/strm-bridge:latest
    build: .
    container_name: strm-bridge
    restart: unless-stopped
    ports:
      - "${BIND_IP:-0.0.0.0}:${HOST_PORT:-18642}:18642"
    environment:
      TZ: Asia/Shanghai
      AUTH_DISABLED: ${AUTH_DISABLED:-0}
      PUBLIC_URL: ${PUBLIC_URL:-http://192.168.50.13:18642}
      SOURCE_ROOTS: '["/cloud"]'
      TARGET_ROOTS: '["/library/video","/library/VIDEO2"]'
    volumes:
      - ./data:/data
      - ${SOURCE_DIR:-/mnt/cloud}:/cloud:rw,rslave
      - /volume1/video:/library/video:rw
      - /volume2/VIDEO2:/library/VIDEO2:rw
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
